name: Build Windows EXE

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Release
      run: cargo build --release

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: target/release/*.exe
              fonts/






        
